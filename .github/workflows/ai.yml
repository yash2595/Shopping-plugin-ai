name: AI package
on:
  push:
    paths: ["ai/**", ".github/workflows/ai.yml"]
  pull_request:
    paths: ["ai/**", ".github/workflows/ai.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e './ai[dev,gemini]'
      - run: ruff check ai
      - run: ruff format --check ai
      - run: python -m pytest ai/tests -q
      - run: shopping-ai ai/examples/product_question.json --fresh-demo
      - run: shopping-ai ai/examples/cart_proposal.json --fresh-demo
