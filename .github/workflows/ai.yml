name: AI package
on:
  push:
    paths: ["ai/**", "backend/**", "frontend/**", "Dockerfile", "compose.yaml", ".dockerignore", ".github/workflows/ai.yml"]
  pull_request:
    paths: ["ai/**", "backend/**", "frontend/**", "Dockerfile", "compose.yaml", ".dockerignore", ".github/workflows/ai.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e './ai[dev,gemini]'
      - run: ruff check ai
      - run: ruff format --check ai
      - run: python -m pytest ai/tests -q
      - run: shopping-ai ai/examples/product_question.json --fresh-demo
      - run: shopping-ai ai/examples/cart_proposal.json --fresh-demo
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shopping_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: shopping_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopping_test -d shopping_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: test
      AI_RUNTIME_ENABLED: "true"
      DATABASE_URL: postgresql+psycopg://shopping_test:ci-only-test-password@127.0.0.1:5432/shopping_test
      TEST_DATABASE_URL: postgresql+psycopg://shopping_test:ci-only-test-password@127.0.0.1:5432/shopping_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://shopping_test:ci-only-test-password@127.0.0.1:5432/shopping_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e './ai[dev]' -e './backend[dev]'
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m alembic downgrade 234eb99aacb2
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
  containers:
    runs-on: ubuntu-latest
    env:
      SHOPPING_DB_PASSWORD: ci-local-container-test-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120 api worker
      - run: curl --fail --silent http://127.0.0.1:8000/health/ready
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run build:electron
        working-directory: frontend
      - run: npm exec tsc -- -p electron/tsconfig.json --noEmit
        working-directory: frontend
