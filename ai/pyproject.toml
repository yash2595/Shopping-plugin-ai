[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-plugin-ai"
version = "0.5.0"
description = "Standalone, grounded shopping AI decisions for a future Chrome extension backend"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
chat = ["httpx>=0.28,<1"]
speech = ["httpx>=0.28,<1"]
gemini = ["google-genai>=1.47,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
shopping-ai = "shopping_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
