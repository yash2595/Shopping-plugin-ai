[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-shopping-copilot-backend"
version = "0.3.0"
description = "Backend for AI Shopping Copilot Chrome Extension"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1",
    "uvicorn[standard]>=0.28.0,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.2.0,<3",
    "sqlalchemy>=2.0.28,<2.1",
    "psycopg[binary]>=3.1.18,<4",
    "alembic>=1.13.1,<2",
    "google-genai>=1.47,<2",
    "PyJWT[crypto]>=2.15.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0,<10",
    "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]
